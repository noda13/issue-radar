name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # backend has no lint script/config and no build script (runs via tsx, not compiled),
      # so only type checking is run here.
      - name: Type check
        run: pnpm --filter ./backend exec tsc --noEmit

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # no lint script/config exists in the repo yet, so lint is skipped here.
      - name: Type check
        run: pnpm --filter ./frontend run type-check

      - name: Build
        run: pnpm --filter ./frontend run build
