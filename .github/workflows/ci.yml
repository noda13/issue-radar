name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # backend has no lint script/config and no build script (runs via tsx, not compiled),
      # so only type checking is run here.
      - name: Type check (backend)
        run: pnpm --filter ./backend exec tsc --noEmit

      # no lint script/config exists in the repo yet, so lint is skipped here.
      - name: Type check (frontend)
        run: pnpm --filter ./frontend run type-check

      - name: Build (frontend)
        run: pnpm --filter ./frontend run build
